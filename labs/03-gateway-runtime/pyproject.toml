[project]
name = "ithelp-gateway-runtime-lab"
version = "0.1.0"
description = "Verify credential and traffic boundaries through one live agentgateway."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pyjwt[crypto]==2.13.0",
]

[project.scripts]
gateway-runtime = "gateway_runtime.cli:entrypoint"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=gateway_runtime",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: starts the pinned agentgateway container",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
