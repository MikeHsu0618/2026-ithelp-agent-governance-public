name: ithelp-agent-traceability

services:
  lgtm:
    image: grafana/otel-lgtm@sha256:6e14b923e0130b8b294ca5bcc7c94d54e899d150817e6c3ed82d9b665afe5499
    ports:
      - 127.0.0.1:13000:3000
      - 127.0.0.1:13100:3100
      - 127.0.0.1:13200:3200
      - 127.0.0.1:19090:9090
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/ready &&
          curl -fsS http://127.0.0.1:3100/ready >/dev/null &&
          curl -fsS http://127.0.0.1:3200/ready >/dev/null
      interval: 3s
      timeout: 2s
      retries: 60
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:12345:12345
      - 127.0.0.1:14317:4317
      - 127.0.0.1:14318:4318
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      lgtm:
        condition: service_healthy
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: Containerfile
    command: ["--role", "runtime"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      LAB_GATEWAY_URL: http://agentgateway:3000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 3s
      timeout: 2s
      retries: 30
    depends_on:
      alloy:
        condition: service_started
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Containerfile
    command: ["--role", "mcp"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 3s
      timeout: 2s
      retries: 30
    depends_on:
      alloy:
        condition: service_started
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
    command: ["--file", "/etc/agentgateway/config.yaml"]
    ports:
      - 127.0.0.1:18080:3000
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
    depends_on:
      runtime:
        condition: service_healthy
      mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  alloy-data:
