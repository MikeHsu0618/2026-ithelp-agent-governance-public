[project]
name = "ithelp-incident-replay"
version = "0.1.0"
description = "Reconstruct Agent actions from locked artifacts and live LGTM evidence without inventing missing fields."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jsonschema==4.26.0",
]

[project.scripts]
incident-replay = "incident_replay.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=incident_replay",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
