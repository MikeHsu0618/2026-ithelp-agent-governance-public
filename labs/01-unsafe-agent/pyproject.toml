[project]
name = "ithelp-unsafe-agent-lab"
version = "0.1.0"
description = "A safe Google ADK lab that demonstrates an untrusted log crossing the Tool boundary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk==2.7.0",
  "opentelemetry-sdk==1.43.0",
]

[project.scripts]
unsafe-agent = "unsafe_agent.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unsafe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=unsafe_agent",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: exercises the Google ADK runner without calling a remote model",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
