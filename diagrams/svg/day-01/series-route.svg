<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 治理三十天：從攻擊面走到組織落地</title>
  <desc id="desc">系列沿著同一條 action path 分成五個階段：Agent 攻擊面、Identity 與 Delegation、Gateway Runtime 與 Provenance、Traceability，以及選型與組織落地。下方整理貫穿全系列的 Identity、Provenance、Enforcement 與 Traceability 四個治理面向。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5296B8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18323F" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F6F8FA"/>
  <text x="80" y="100" font-family="Noto Sans TC, Inter, sans-serif" font-size="50" font-weight="700" fill="#18323F">Agent 治理三十天：從攻擊面走到組織落地</text>
  <text x="80" y="153" font-family="Noto Sans TC, Inter, sans-serif" font-size="28" fill="#526873">沿著同一條 action path，依序補上身分、執行控制與可回放證據</text>

  <line x1="324" y1="385" x2="371" y2="385" stroke="#5296B8" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="622" y1="385" x2="669" y2="385" stroke="#5296B8" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="920" y1="385" x2="967" y2="385" stroke="#5296B8" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="1218" y1="385" x2="1265" y2="385" stroke="#5296B8" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="250" width="252" height="270" rx="26" fill="#FFF8F5" stroke="#F26D4F" stroke-width="6"/>
    <rect x="370" y="250" width="252" height="270" rx="26" fill="#FFFFFF" stroke="#5296B8" stroke-width="5"/>
    <rect x="668" y="250" width="252" height="270" rx="26" fill="#FFFFFF" stroke="#E08A4F" stroke-width="5"/>
    <rect x="966" y="250" width="252" height="270" rx="26" fill="#FFFFFF" stroke="#5296B8" stroke-width="5"/>
    <rect x="1264" y="250" width="264" height="270" rx="26" fill="#18323F"/>
  </g>

  <text x="198" y="310" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700" fill="#A54736">DAY 1–5</text>
  <text x="198" y="370" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="33" font-weight="700" fill="#18323F">Agent 攻擊面</text>
  <text x="198" y="423" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" fill="#526873">危險動作重現</text>
  <text x="198" y="460" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" fill="#526873">Trust boundary</text>

  <text x="496" y="310" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700" fill="#3D7895">DAY 6–12</text>
  <text x="496" y="365" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="33" font-weight="700" fill="#18323F">Identity</text>
  <text x="496" y="408" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="29" font-weight="700" fill="#18323F">與 Delegation</text>
  <text x="496" y="452" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">Human・Agent</text>
  <text x="496" y="482" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">Workload</text>

  <text x="794" y="310" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700" fill="#B46732">DAY 13–19</text>
  <text x="794" y="360" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="30" font-weight="700" fill="#18323F">Gateway</text>
  <text x="794" y="402" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="28" font-weight="700" fill="#18323F">Runtime</text>
  <text x="794" y="444" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="28" font-weight="700" fill="#18323F">Provenance</text>
  <text x="794" y="482" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">流量、執行與來源</text>

  <text x="1092" y="310" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700" fill="#3D7895">DAY 20–26</text>
  <text x="1092" y="370" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="31" font-weight="700" fill="#18323F">Traceability</text>
  <text x="1092" y="421" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" fill="#526873">LGTM 與跨元件</text>
  <text x="1092" y="458" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" fill="#526873">事件重建</text>

  <text x="1396" y="310" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700" fill="#BFD8E4">DAY 27–30</text>
  <text x="1396" y="369" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">選型與</text>
  <text x="1396" y="412" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">組織落地</text>
  <text x="1396" y="458" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#DCE9EF">維運責任與採用邊界</text>

  <text x="80" y="625" font-family="Noto Sans TC, Inter, sans-serif" font-size="30" font-weight="700" fill="#18323F">貫穿全系列的四個治理面向</text>
  <rect x="80" y="670" width="330" height="105" rx="20" fill="#E8F1F5"/>
  <rect x="445" y="670" width="330" height="105" rx="20" fill="#FFF0E5"/>
  <rect x="810" y="670" width="330" height="105" rx="20" fill="#FFF0EC"/>
  <rect x="1175" y="670" width="345" height="105" rx="20" fill="#E8F1F5"/>
  <text x="245" y="714" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#286A8A">Identity</text>
  <text x="245" y="750" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#18323F">身分與代理關係</text>
  <text x="610" y="714" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#A65313">Provenance</text>
  <text x="610" y="750" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#18323F">Artifact 來源與完整性</text>
  <text x="975" y="714" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#B3332C">Enforcement</text>
  <text x="975" y="750" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#18323F">執行前政策</text>
  <text x="1347" y="714" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#286A8A">Traceability</text>
  <text x="1347" y="750" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#18323F">可回放的稽核證據</text>
</svg>
