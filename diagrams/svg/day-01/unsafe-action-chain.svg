<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">不可信 Log 如何一路走到 Tool 執行</title>
  <desc id="desc">不可信 Log 進入 ADK Agent context，Gemini 提出 delete_demo_database Tool Call。before_tool_callback 的 open policy 回覆 ALLOW，Function Tool 因此執行並追加安全 canary event。圖中把模型提出動作與系統授權執行分開呈現。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#337A9E"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C56A13"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C73E36"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18323F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F7F9FB"/>

  <text x="64" y="92" font-family="Noto Sans TC, Inter, sans-serif" font-size="54" font-weight="700" fill="#18323F">不可信 Log 如何一路走到 Tool 執行</text>
  <text x="64" y="145" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" fill="#526873">模型提出動作，不等於系統已經授權執行</text>

  <rect x="54" y="214" width="830" height="420" rx="30" fill="#EAF4F8"/>
  <rect x="906" y="214" width="640" height="420" rx="30" fill="#FFF4EA"/>
  <text x="88" y="263" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#286A8A">資料與模型判斷</text>
  <text x="940" y="263" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#A65313">授權與執行</text>

  <line x1="293" y1="420" x2="344" y2="420" stroke="#337A9E" stroke-width="7" marker-end="url(#arrow-blue)"/>
  <line x1="573" y1="420" x2="624" y2="420" stroke="#337A9E" stroke-width="7" marker-end="url(#arrow-blue)"/>
  <line x1="853" y1="420" x2="914" y2="420" stroke="#C56A13" stroke-width="7" marker-end="url(#arrow-amber)"/>
  <line x1="1183" y1="420" x2="1234" y2="420" stroke="#C73E36" stroke-width="7" marker-end="url(#arrow-red)"/>

  <g filter="url(#shadow)">
    <rect x="84" y="318" width="209" height="204" rx="24" fill="#FFFFFF" stroke="#5296B8" stroke-width="4"/>
    <rect x="364" y="318" width="209" height="204" rx="24" fill="#FFFFFF" stroke="#5296B8" stroke-width="4"/>
    <rect x="644" y="318" width="209" height="204" rx="24" fill="#FFFFFF" stroke="#5296B8" stroke-width="4"/>
    <rect x="934" y="298" width="249" height="244" rx="24" fill="#FFFFFF" stroke="#D6822E" stroke-width="5"/>
    <rect x="1254" y="298" width="249" height="244" rx="24" fill="#FFFFFF" stroke="#C73E36" stroke-width="6"/>
  </g>

  <text x="188" y="378" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="31" font-weight="700" fill="#18323F">不可信 Log</text>
  <text x="188" y="428" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#526873">外部資料藏有</text>
  <text x="188" y="463" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#526873">操作指令</text>

  <text x="468" y="378" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="31" font-weight="700" fill="#18323F">ADK Agent</text>
  <text x="468" y="428" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#526873">組合 instruction、</text>
  <text x="468" y="463" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#526873">Log 與 Tool schema</text>

  <text x="748" y="378" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="31" font-weight="700" fill="#18323F">Gemini</text>
  <text x="748" y="428" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" fill="#526873">提出 Tool Call</text>
  <text x="748" y="463" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">delete_demo_database</text>

  <text x="1058" y="360" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="30" font-weight="700" fill="#18323F">Policy 決策</text>
  <text x="1058" y="411" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="21" fill="#526873">before_tool_callback</text>
  <rect x="982" y="445" width="152" height="52" rx="26" fill="#FFF0DB"/>
  <text x="1058" y="479" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="23" font-weight="700" fill="#A65313">open → ALLOW</text>

  <text x="1378" y="356" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="30" font-weight="700" fill="#18323F">Function Tool</text>
  <text x="1378" y="405" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">執行動作</text>
  <text x="1378" y="440" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">追加 canary event</text>
  <rect x="1285" y="468" width="186" height="48" rx="24" fill="#FCE8E6"/>
  <text x="1378" y="500" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700" fill="#B3332C">CANARY_TRIGGERED</text>

  <line x1="1218" y1="282" x2="1218" y2="560" stroke="#C73E36" stroke-width="3" stroke-dasharray="10 10"/>
  <rect x="1133" y="550" width="170" height="42" rx="21" fill="#C73E36"/>
  <text x="1218" y="578" text-anchor="middle" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">副作用邊界</text>

  <rect x="54" y="674" width="1492" height="142" rx="26" fill="#FFFFFF" stroke="#D9E2E7" stroke-width="2"/>
  <text x="92" y="722" font-family="Noto Sans TC, Inter, sans-serif" font-size="25" font-weight="700" fill="#18323F">讀圖重點</text>
  <text x="92" y="767" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" fill="#18323F">Prompt Injection 發生在輸入端；真正的副作用，要等 policy 放行且 Function Tool 開始執行才會出現。</text>
  <text x="92" y="801" font-family="Noto Sans TC, Inter, sans-serif" font-size="22" fill="#526873">這次 Lab 的 Tool 只追加 canary event，未連接真實資料庫。</text>
</svg>
